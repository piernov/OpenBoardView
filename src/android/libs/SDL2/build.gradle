apply plugin: 'com.android.library'

android {
    compileSdkVersion 32
    buildToolsVersion "32.0.0"
    ndkVersion "24.0.8215888"

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 32
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "armeabi-v7a", "x86_64"
        }
    }
    externalNativeBuild {
        ndkBuild {
            path "../../../SDL2/Android.mk"
        }
    }

    lintOptions {
        disable "NewApi"
    }
}

dependencies {
    api fileTree(dir: 'libs', include: ['*.jar'])
}
